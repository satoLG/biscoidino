name: 🧪 Automated Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Prevent duplicate workflows from running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🎭 Run Playwright Tests
    runs-on: ubuntu-24.04
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🎭 Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: 🏗️ Build the project
      run: npm run build

    - name: 🧪 Run Playwright tests
      run: npm run test

    - name: 📊 Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30



  lighthouse:
    name: 🚨 Lighthouse Performance Audit
    runs-on: ubuntu-24.04
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🏗️ Build the project
      run: npm run build

    - name: 🚀 Start preview server
      run: |
        npm run preview &
        sleep 5
        curl --fail http://localhost:4173 || exit 1

    - name: 🚨 Run Lighthouse CI
      run: |
        npm install -g @lhci/cli
        lhci autorun --upload.target=temporary-public-storage
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  accessibility:
    name: ♿ Accessibility Testing
    runs-on: ubuntu-24.04
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🎭 Install Playwright with dependencies
      run: npx playwright install --with-deps

    - name: 🏗️ Build the project
      run: npm run build

    - name: ♿ Run accessibility tests
      run: |
        npx playwright test --grep "accessibility|a11y" || echo "No specific accessibility tests found"

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-24.04
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔍 Run npm audit
      run: npm audit --audit-level=moderate

    - name: 🔒 Security scan with Snyk
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

  notify:
    name: 📢 Notify Results
    needs: [test, lighthouse, accessibility, security]
    runs-on: ubuntu-24.04
    if: always()
    
    steps:
    - name: 📢 Notify on success
      if: needs.test.result == 'success'
      run: |
        echo "✅ All tests passed successfully!"
        echo "🎉 The Biscoidino app is ready for deployment!"

    - name: 📢 Notify on failure
      if: needs.test.result == 'failure'
      run: |
        echo "❌ Some tests failed!"
        echo "🔧 Please check the test reports and fix the issues."
